name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run automated tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release
      - name: Run installer contract tests
        shell: pwsh
        run: ./tests/Installer.Tests.ps1
      - name: Build application
        shell: pwsh
        run: dotnet build OrderedClicker.sln -c Release --no-restore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install guide dependencies
        run: python -m pip install reportlab pypdf
      - name: Build product guides
        run: |
          python scripts/guide/build_product_guide.py
          python scripts/guide/build_pdf_guide.py
          python scripts/guide/verify_guide.py --skip-video
      - name: Install Inno Setup 7
        shell: pwsh
        run: >-
          winget install --id JRSoftware.InnoSetup.7 --exact --silent
          --accept-package-agreements --accept-source-agreements
      - name: Build release packages
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build-installer.ps1 `
            -Version $version `
            -ProductDirectory "${{ runner.temp }}\ordered-clicker-product"
      - name: Stage release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $productDirectory = "${{ runner.temp }}\ordered-clicker-product"
          $releaseDirectory = "${{ runner.temp }}\ordered-clicker-release"

          if (Test-Path -LiteralPath $releaseDirectory) {
            Remove-Item -LiteralPath $releaseDirectory -Recurse -Force
          }

          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null
          $assets = @(
            @{
              Source = Join-Path $productDirectory "ordered-clicker-setup-v$version.exe"
              Destination = "ordered-clicker-setup-v$version.exe"
            },
            @{
              Source = Join-Path $productDirectory "有序连点器-免安装.exe"
              Destination = "ordered-clicker-portable-v$version.exe"
            },
            @{
              Source = Join-Path $productDirectory "有序连点器-使用说明.pdf"
              Destination = "ordered-clicker-user-guide-v$version.pdf"
            },
            @{
              Source = Join-Path $productDirectory "有序连点器-使用说明.html"
              Destination = "ordered-clicker-user-guide-v$version.html"
            },
            @{
              Source = Join-Path $PWD "publish\packages\ordered-clicker-portable-v$version.zip"
              Destination = "ordered-clicker-portable-v$version.zip"
            }
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset.Source -PathType Leaf)) {
              throw "Release asset is missing: $($asset.Source)"
            }

            Copy-Item `
              -LiteralPath $asset.Source `
              -Destination (Join-Path $releaseDirectory $asset.Destination)
          }

          $hashLines = foreach ($asset in $assets) {
            $releaseAssetPath = Join-Path $releaseDirectory $asset.Destination
            $hash = (Get-FileHash -LiteralPath $releaseAssetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Destination)"
          }
          $hashLines | Set-Content `
            -LiteralPath (Join-Path $releaseDirectory "SHA256SUMS.txt") `
            -Encoding utf8NoBOM
      - name: Prepare GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Replace release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}\ordered-clicker-release
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem -LiteralPath $env:RELEASE_DIRECTORY -File | Sort-Object Name)
          if ($files.Count -eq 0) {
            throw "No staged release assets to upload."
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "ordered-clicker-release"
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $tag = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $release = Invoke-RestMethod -Method Get -Uri "$apiRoot/releases/tags/$tag" -Headers $headers
          $uploadUrl = $release.upload_url -replace '\{.*$', ''
          if (-not $release.id -or -not $uploadUrl) {
            throw "Release API returned no release ID or upload URL."
          }
          $existing = @(
            $page = 1
            do {
              $batch = @(Invoke-RestMethod -Method Get `
                -Uri "$apiRoot/releases/$($release.id)/assets?per_page=100&page=$page" -Headers $headers)
              $batch
              $page++
            } while ($batch.Count -eq 100)
          )
          $uploaded = [System.Collections.Generic.List[object]]::new()
          $uploadId = [guid]::NewGuid().ToString("N")
          try {
            foreach ($file in $files) {
              $temporaryName = "$($file.Name).upload-$uploadId"
              $encodedName = [uri]::EscapeDataString($temporaryName)
              $asset = Invoke-RestMethod -Method Post -Uri "${uploadUrl}?name=$encodedName" `
                -Headers $headers -ContentType "application/octet-stream" -InFile $file.FullName
              if (-not $asset.id) {
                throw "Upload returned no asset ID: $($file.Name)"
              }
              $uploaded.Add([pscustomobject]@{ Id = $asset.id; Name = $file.Name })
            }
          }
          catch {
            $uploadFailure = $_
            foreach ($asset in $uploaded) {
              try {
                Invoke-RestMethod -Method Delete -Uri "$apiRoot/releases/assets/$($asset.Id)" `
                  -Headers $headers | Out-Null
              }
              catch {
                Write-Warning "Unable to remove temporary asset $($asset.Id): $_"
              }
            }
            throw $uploadFailure
          }

          # Do not touch the old release until every new file has uploaded successfully.
          foreach ($asset in $uploaded) {
            foreach ($oldAsset in $existing) {
              if ([string]::Equals($oldAsset.name, $asset.Name, [StringComparison]::Ordinal)) {
                Invoke-RestMethod -Method Delete -Uri "$apiRoot/releases/assets/$($oldAsset.id)" `
                  -Headers $headers | Out-Null
              }
            }
            $body = @{ name = $asset.Name } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Patch -Uri "$apiRoot/releases/assets/$($asset.Id)" `
              -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          }
